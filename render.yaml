services:
  - type: web
    name: koya-clinic-booking
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_KEY
        value: koya-booking-9f3c2f1a7d5e6b4c
      - key: DATABASE_URL
        sync: false
